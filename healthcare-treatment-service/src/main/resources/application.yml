spring:
  application:
    name: healthcare-treatment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcare_journey}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes any drift between the migrations and the
      # entities fail at startup instead of Hibernate silently altering production tables.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Camunda 8.9 SaaS connection. Every value defaults to empty rather than being required:
# a missing credential should surface as a connection failure you can read, not as an
# unresolvable-placeholder crash before the context is even built.
#
# Real values belong in application-local.yml (git-ignored, profile `local`) — see
# application-local.yml.example. Run with:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=local"
camunda:
  client:
    mode: saas
    auth:
      client-id: ${CAMUNDA_CLIENT_ID:}
      client-secret: ${CAMUNDA_CLIENT_SECRET:}
    cloud:
      cluster-id: ${CAMUNDA_CLUSTER_ID:}
      region: ${CAMUNDA_REGION:sin-1}

framework:
  camunda:
    multi-tenant: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.aaseya.healthcare: DEBUG
    com.aaseya.camunda.framework: INFO
    io.camunda: INFO
