# ArchUnit configuration for framework-test's own self-tests.
#
# Three rules in ArchitectureRules use package-based filters (..domain.., ..infrastructure.camunda..,
# ..web..|..workers..). The inner Good/Bad pojos in ArchitectureRulesTest deliberately do not live
# in those packages — they exist only to exercise the rule shapes. ArchUnit's default behaviour is
# to fail a rule if it matches zero classes; disabling that here lets the rule-well-formedness
# smoke tests run without contriving package-hierarchy fixtures.
#
# This file affects framework-test's own tests ONLY. Consumers of framework-test scan their own
# service packages via @AnalyzeClasses and inherit ArchUnit's stricter default (a rule that
# matches zero classes indicates a misconfigured scan and should fail loudly).
archRule.failOnEmptyShould=false
